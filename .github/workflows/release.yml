name: Build release zip

# Runs when a version tag (e.g. v1.0.0) is pushed, or manually from the
# Actions tab. Pinned to the organisation's SELF-HOSTED Windows runner -
# it never uses GitHub-hosted runners.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create the Release and upload the zip

jobs:
  build:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item Find-SequenceGaps.ps1, find-sequence-gaps.command, HOW-TO-USE.txt, README.md -Destination dist
          if (Test-Path BexmediaFileSequenceChecker.zip) { Remove-Item BexmediaFileSequenceChecker.zip }
          Compress-Archive -Path dist\* -DestinationPath BexmediaFileSequenceChecker.zip -Force
          Write-Host "Built BexmediaFileSequenceChecker.zip"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          gh release create $tag BexmediaFileSequenceChecker.zip `
            --title "Bexmedia File Sequence Checker $tag" `
            --notes "Download **BexmediaFileSequenceChecker.zip**, unzip it, and follow HOW-TO-USE.txt. Windows: Find-SequenceGaps.ps1. Mac: find-sequence-gaps.command."

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BexmediaFileSequenceChecker
          path: BexmediaFileSequenceChecker.zip
